# Active when SPRING_PROFILES_ACTIVE=docker

# --- Database (PostgreSQL) ---
# Environment variables override defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/tasksdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tasks}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tasks}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Schema managed by Liquibase, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- H2 ---
# Disable H2 console in Docker
spring.h2.console.enabled=false

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/master.xml