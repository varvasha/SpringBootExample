# --- Application ---
spring.application.name=spring-boot-application-example

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/master.xml

# --- H2 (in-memory DB for local dev) ---
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1

# --- JPA / Hibernate ---
# Schema managed by Liquibase, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Error handling (dev-friendly verbose mode) ---
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=ALWAYS
