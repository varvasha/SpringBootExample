ID: task-app-mta
version: 1.0.0
description: Task app with PostgreSQL on SAP BTP

modules:
  - name: task-app-prod
    type: java
    path: target/spring-boot-application-example-0.0.1-SNAPSHOT.jar
    parameters:
      memory: 192M
      disk-quota: 1G
      buildpack: java_buildpack
      random-route: true
      env:
        SPRING_PROFILES_ACTIVE: prod
        JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
        JAVA_OPTS: "-Xmx120m -Xss256k -XX:ReservedCodeCacheSize=32m -XX:MaxMetaspaceSize=96m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC"
        SERVER_TOMCAT_MAX_THREADS: "20"
    requires:
      - name: my-postgres-service

resources:
  - name: my-postgres-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: trial