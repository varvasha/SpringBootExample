applications:
  - name: task-app
    memory: 256M
    disk_quota: 1G
    path: target/spring-boot-application-example-0.0.1-SNAPSHOT.jar
    buildpacks:
      - java_buildpack
    random-route: true
    services:
      - my-postgres
    env:
      # авто-рекаст, чтобы Postgres подхватился из VCAP_SERVICES
      JBP_CONFIG_SPRING_AUTO_RECONFIGURATION: '{enabled: true}'

      # Java 17 для java_buildpack
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'

      # 3) JVM, чтобы не упираться в память
      JAVA_OPTS: >
        -Xmx160m -Xss256k
        -XX:ReservedCodeCacheSize=32m
        -XX:MaxMetaspaceSize=96m
        -XX:TieredStopAtLevel=1
        -XX:+UseSerialGC

      # количество серверных потоков Tomcat
      SERVER_TOMCAT_MAX_THREADS: "20"